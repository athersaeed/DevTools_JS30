<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Console Tricks!</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>

  <p onClick="makeGreen()">×BREAK×DOWN×</p>

  <script>
    const dogs = [{ name: 'Snickers', age: 2 }, { name: 'hugo', age: 8 }];

    function makeGreen() {
      const p = document.querySelector('p');
      p.style.color = '#BADA55';
      p.style.fontSize = '50px';
    }

    // Regular
    console.log("hello");

    // Interpolated
    console.log('hello i am %s man', '🔥');
    console.log(`hello i am ${'🔥'} man`);

    // Styled
    // console.log('%c hello world!', 'font-size:50px; background: red; text-shadow:10px 10px 0 blue');

    // warning!
    console.warn('OH NOO')

    // Error :|
    console.error(' Error: fix it')

    // Info
    console.info('Crocodiles eat 3-4 people every year')

    // Testing
    // console.assert(1 === 2, 'that is wrong')

    const p = document.querySelector('p')
    console.assert(p.classList.contains('ouch'), 'that is wrong')

    // clearing
    console.clear()

    // Viewing DOM Elements
    console.log(p)
    console.dir(p)

    // Grouping together
    dogs.forEach(dog => {
        console.groupCollapsed(`${dog.name}`)
        console.log(`This is ${dog.name}.`);
        console.log(`${dog.name} is ${dog.age} years old.`);
        console.log(`${dog.name} is ${dog.age * 7} dog years old.`);
        console.groupEnd();
    })

    // counting
    console.count('dogs')
    console.count('dogs')
    console.count('dogs')
    console.count('dogs')
    console.count('dogs')
    
    // timing
    console.time('fetching data')
    fetch('https://api.github.com/users/athersaeed')
    .then(data => data.json)
    .then(data =>{
        console.timeEnd('fetching data')
        console.log(data)
    })

    // table
    console.table(dogs)

  </script>
</body>
</html>
